name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (format, temp-fixes, Lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      - name: Build the lightweight checks
        run: >
          nix build --print-build-logs --no-link
          .#checks.x86_64-linux.treefmt
          .#checks.x86_64-linux.temp-fixes-lint
          .#checks.x86_64-linux.hyprland-lua

  eval:
    name: Evaluate both hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      # Stylix reads its colour scheme through import-from-derivation, which
      # `--no-build` cannot realise on a fresh runner; `nix eval` fetches it
      # from the binary cache first.
      - name: Realise IFD inputs
        run: |
          for host in desktop laptop; do
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
            echo
          done
      # Evaluates every check, including the desktop and laptop toplevels,
      # without building anything.
      - run: nix flake check --no-build --show-trace
