# Hypridle configuration

# General settings - automatically lock using Caelestia and handle DPMS
# when the system goes to sleep or wakes up
#
# Caelestia's lock lives inside the shell process. hyprlock is kept only as a
# fallback for when the shell is not running: never run it alongside Caelestia,
# it crashes the shell (caelestia-dots/shell#988).

general {
    lock_cmd = if systemctl --user is-active --quiet caelestia; then caelestia shell lock lock; elif ! pidof hyprlock >/dev/null; then hyprlock; fi
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Lock the session after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off the screen one minute later
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
