# Registre des fix temporaires
#
# Chaque contournement (paquet épinglé, overlay, option forcée, patch...) a une
# entrée ici ET un commentaire `TEMP-FIX(<id>)` à côté du code concerné.
# `temp-fixes lint` vérifie la cohérence des deux ; la CI le lance à chaque push.
#
# Champs : voir docs/reference/temp-fixes.md.
#   removal_test : commande lancée depuis la racine du dépôt qui RÉUSSIT quand le
#                  contournement n'est plus nécessaire (`temp-fixes check`).
#   history      : une ligne par revue/décision, la plus récente en dernier.

[[fix]]
id = "solaar-unstable"
title = "Solaar pris sur nixpkgs-unstable"
status = "active"
hosts = ["desktop", "laptop"]
files = ["modules/nixos/hardware/logitech.nix"]
reason = "La suite de tests de solaar 1.1.19 (nixos-26.05) échoue dans le sandbox de build."
removal_condition = "Le solaar de la branche stable construit (tests corrigés ou version plus récente)."
removal_test = "nix build --no-link --inputs-from . nixpkgs#solaar"
added = 2026-10-17
review_after = 2026-11-28
history = ["2026-10-17 : entrée créée lors de l'audit."]

[[fix]]
id = "nvidia-driver-pin"
title = "Pilote NVIDIA 595.71.05 figé à la main (mkDriver)"
status = "active"
hosts = ["desktop"]
files = ["modules/nixos/hardware/nvidia.nix"]
reason = "Pilote plus récent que ceux fournis par nixpkgs au moment du changement de noyau (juillet 2026)."
removal_condition = "nvidiaPackages.production (ou latest) de nixpkgs fournit une version ≥ 595.71.05."
removal_test = "v=$(nix eval --raw .#nixosConfigurations.desktop.config.boot.kernelPackages.nvidiaPackages.production.version) && [ \"$(printf '%s\\n' 595.71.05 \"$v\" | sort -V | head -n1)\" = 595.71.05 ]"
added = 2026-07-02
review_after = 2026-11-28
history = ["2026-10-17 : entrée créée lors de l'audit."]

[[fix]]
id = "hypridle-forced-off"
title = "hypridle forcé à off (mkForce)"
status = "active"
hosts = ["desktop", "laptop"]
files = ["modules/nixos/desktop/default.nix"]
reason = "Le module nixpkgs de hyprlock active services.hypridle sans condition, alors que Caelestia gère la mise en veille."
removal_condition = "Le module programs.hyprlock de nixpkgs n'active plus hypridle d'office."
removal_test = "! grep -q hypridle \"$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')/nixos/modules/programs/wayland/hyprlock.nix\""
added = 2026-08-08
review_after = 2027-01-15
history = ["2026-10-17 : entrée créée lors de l'audit."]

