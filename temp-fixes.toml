[[fix]]
id = "rtw89-out-of-tree"
title = "Pilote Wi-Fi rtw89 hors arbre (morrownr) pour la clé TP-Link TXE70UH"
status = "active"
hosts = ["desktop", "laptop"]
files = ["modules/nixos/hardware/rtw89.nix"]
reason = "La puce RTL8852CU (USB) n'est pas prise en charge par le rtw89 du noyau utilisé."
removal_condition = "Le noyau de nixpkgs fournit un module rtw89_8852cu (vérifier aussi que la clé fonctionne sans le firmware morrownr)."
removal_test = "find \"$(nix build --no-link --print-out-paths .#nixosConfigurations.laptop.config.boot.kernelPackages.kernel.modules)\" -name 'rtw89_8852cu*' | grep -q ."
added = 2025-12-25
review_after = 2026-11-28
history = ["2026-10-17 : entrée créée lors de l'audit."]
